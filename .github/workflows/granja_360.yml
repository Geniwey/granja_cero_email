name: Granja LogiQuote 360 (Cero-Email y Cero-Telefono)

on:
  workflow_dispatch: # Botón manual para probarlo cuando quieras
  schedule:
    # Corre cada DOMINGO y MIÉRCOLES a las 04:00 AM UTC
    - cron: '0 4 * * 0,3'

jobs:
  run_granja_digital:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Granja Multicanal Digital
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python granja_360.py
