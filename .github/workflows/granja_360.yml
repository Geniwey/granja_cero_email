name: Granja LogiQuote 360 FULL AUTO

on:
  workflow_dispatch:
  schedule:
    # Corre LUNES, MIÉRCOLES y VIERNES a las 08:30 AM UTC (horario laboral España)
    - cron: '30 8 * * 1,3,5'

jobs:
  cazar_y_disparar_full_auto:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y navegador autónomo
        run: |
          pip install supabase requests beautifulsoup4 ddgs googlesearch-python playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 1. Cazar nuevas oportunidades B2B
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python granja_360.py

      - name: 2. Disparar formularios web y LinkedIn en Full Auto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          REPLY_EMAIL: ${{ secrets.REPLY_EMAIL }}
        run: python disparador_full_auto.py
